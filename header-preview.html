<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Header 最终版</title><style>
:root{--bg:#f7f7f5;--bg2:#efeeeb;--tx:#111827;--tx2:#6b7280;--tx3:#9ca3af;--bd:#e5e7eb;--a:#16a34a;--a2:#0d9488;--a3:#84cc16}

*,*::before,*::after{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
.tb{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:rgba(247,247,245,.6);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}.dark .tb{background:rgba(8,12,20,.6)}
.tb h2{font-size:.875rem;font-weight:600;color:var(--tx2)}
.tb button{padding:.25rem .75rem;border:1px solid var(--bd);border-radius:2px;background:none;color:var(--tx2);cursor:pointer;font-size:.8125rem;font-family:inherit;transition:all .2s}
.tb button:hover{border-color:var(--a);color:var(--a)}
.tb button.on{background:var(--a);color:#080c14;border-color:var(--a);font-weight:600}
.ct{max-width:960px;margin:4rem auto 2rem;padding:0 1.5rem}
.sd{margin:4rem 0 1rem}
.sl{font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);padding:.5rem 0;border-bottom:1px solid var(--bd);margin-bottom:2rem}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:2rem}.cg .sl{grid-column:1/-1}
.geo{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden}

@keyframes ocw{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes occw{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.55}}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.7}}
@keyframes meteor{0%{transform:translate(-100px,0);opacity:1}70%{opacity:.8}100%{transform:translate(1060px,60px);opacity:0}}
@keyframes spinS{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.12;r:16}50%{opacity:.45;r:22}}
.ocw{animation:ocw 28s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
.occw{animation:occw 22s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
.of{animation:ocw 14s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
.ofx{animation:occw 16s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
.pu{animation:pulse 3s ease-in-out infinite}
.gl{animation:glow 2.5s ease-in-out infinite}
.meteor{animation:meteor 8s linear infinite}.m2{animation-delay:4s}
.ss{animation:spinS 50s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
.br{animation:breathe 3s ease-in-out infinite}
.d1{animation-delay:0s}.d2{animation-delay:.7s}.d3{animation-delay:1.4s}

.hh{position:relative;padding:5rem 0 4.5rem;text-align:center;overflow:hidden}
.hhi{display:flex;justify-content:center;margin-bottom:2rem;position:relative;z-index:1}
.hhi svg{width:72px;height:72px;color:var(--a);filter:drop-shadow(0 0 8px var(--a));opacity:.95}
.hht{font-size:2.75rem;font-weight:800;letter-spacing:-.04em;color:var(--tx);line-height:1.1;margin-bottom:.75rem;position:relative;z-index:1}
.hhl{width:64px;height:3px;background:linear-gradient(90deg,transparent,var(--a),transparent);margin:.75rem auto 1rem;position:relative;z-index:1}
.hhs{font-size:1rem;color:var(--tx2);margin-bottom:.5rem;position:relative;z-index:1}
.hhst{font-size:.8125rem;color:var(--tx3);position:relative;z-index:1}.hhst strong{color:var(--a);font-weight:700}

.hp{position:relative;padding:5rem 0 3.5rem;text-align:center;overflow:hidden}
.hpi{position:relative;z-index:1}
.hpb{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin-bottom:1.5rem;border:1px solid var(--bd);border-radius:2px;color:var(--tx3);cursor:pointer;font-size:.875rem;font-family:inherit;line-height:1;background:none;transition:all .25s}
.hpb:hover{color:var(--a);border-color:var(--a);box-shadow:0 0 0 1px var(--a);transform:scale(1.05)}
.hpt{font-size:2.75rem;font-weight:800;letter-spacing:-.04em;color:var(--tx);line-height:1.15;margin-bottom:1.25rem;text-transform:capitalize}
.hps{font-size:.9375rem;color:var(--tx2);margin-bottom:1.5rem}
.hpc{font-size:1.75rem;font-weight:700;color:var(--a);letter-spacing:-.02em}
.hpc small{font-size:.8125rem;font-weight:500;color:var(--tx3);margin-left:.375rem}

.ha{position:relative;padding:3rem 0 2.5rem;overflow:hidden}
.hai{border-left:3px solid var(--a);padding-left:1.25rem;max-width:680px}
@media(max-width:700px){.cg{grid-template-columns:1fr}.hht,.hpt{font-size:2rem}}
</style></head><body>
