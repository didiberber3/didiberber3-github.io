<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} - Java 学习笔记</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
</head>
<body>
<nav class="top-nav">
  <a href="../index.html">&larr; 首页</a>
  <div class="search-wrap">
    <input type="search" class="search-input" id="searchInput" placeholder="搜索..." autocomplete="off">
    <div class="search-dropdown" id="searchDropdown"></div>
  </div>
  <span class="nav-title">{{TITLE}}</span>
  <time class="nav-date">{{DATE}}</time>
</nav>
<div class="main-wrapper">
  <button class="toc-toggle" id="tocToggle">目 录 ▸</button>
  <aside class="toc-sidebar" id="tocSidebar">
    <nav class="toc-nav" id="tocNav"></nav>
  </aside>
  <main class="article-content">
  {{CONTENT}}
  </main>
</div>
<footer></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/xml.min.js"></script>
<script>hljs.highlightAll();</script>
<script>
(function(){
  var toc = document.getElementById('tocNav');
  var hs = document.querySelectorAll('.article-content h1, .article-content h2, .article-content h3');
  if (!hs.length) return;
  var list = document.createElement('ul');
  list.className = 'toc-list';
  hs.forEach(function(h){
    var li = document.createElement('li');
    li.className = 'toc-item toc-' + h.tagName.toLowerCase();
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    list.appendChild(li);
  });
  toc.appendChild(list);

  var toggle = document.getElementById('tocToggle');
  var sidebar = document.getElementById('tocSidebar');
  if (toggle && sidebar) {
    toggle.addEventListener('click', function(){
      var open = sidebar.classList.toggle('open');
      toggle.textContent = open ? '目 录 ▾' : '目 录 ▸';
    });
    toggle.style.display = '';
  }

  var items = toc.querySelectorAll('.toc-item a');
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting){
        items.forEach(function(a){ a.parentElement.classList.remove('active'); });
        var id = e.target.id;
        var link = toc.querySelector('a[href="#' + CSS.escape(id) + '"]');
        if (link) link.parentElement.classList.add('active');
      }
    });
  }, { rootMargin: '-80px 0px -70% 0px' });
  hs.forEach(function(h){ observer.observe(h); });

  items.forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      var target = document.getElementById(a.getAttribute('href').slice(1));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (sidebar.classList.contains('open')) {
        sidebar.classList.remove('open');
        toggle.textContent = '目 录 ▸';
      }
    });
  });
})();
</script>
<script>
(function(){
  var inp = document.getElementById('searchInput');
  var drop = document.getElementById('searchDropdown');
  var sections = [];
  var content = document.querySelector('.article-content');
  if (content) {
    var hs = content.querySelectorAll('h1, h2, h3');
    hs.forEach(function(h){
      var text = '';
      var el = h.nextElementSibling;
      while (el && !/^H[1-3]$/.test(el.tagName)) {
        text += ' ' + (el.textContent || '');
        el = el.nextElementSibling;
      }
      sections.push({ id: h.id, title: h.textContent.trim(), text: text.toLowerCase() });
    });
  }
  inp.placeholder = '搜本文...';
  inp.addEventListener('input', function(){
    var q = this.value.trim().toLowerCase();
    if (!q) { drop.innerHTML = ''; drop.classList.remove('show'); return; }
    var r = sections.filter(function(s){ return s.title.toLowerCase().indexOf(q)>-1 || s.text.indexOf(q)>-1; }).slice(0,8);
    if (!r.length) { drop.innerHTML = '<div class="search-empty">无结果</div>'; }
    else { drop.innerHTML = r.map(function(s){ return '<a class="search-item" href="#'+s.id+'"><span>'+_hl(s.title,q)+'</span></a>'; }).join(''); }
    drop.classList.add('show');
  });
  function _hl(t,q){ var i=t.toLowerCase().indexOf(q); if(i<0)return t; return t.slice(0,i)+'<em>'+t.slice(i,i+q.length)+'</em>'+t.slice(i+q.length); }
  document.addEventListener('click',function(e){ if(!e.target.closest('.search-wrap')) drop.classList.remove('show'); });
  drop.addEventListener('click',function(e){
    var a = e.target.closest('a');
    if (!a) return;
    e.preventDefault();
    var target = document.getElementById(a.getAttribute('href').slice(1));
    if (target) { target.scrollIntoView({behavior:'smooth',block:'start'}); drop.classList.remove('show'); }
  });
})();
</script>
</body>
</html>
